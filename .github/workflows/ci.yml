name: CI

on:
  push:
    branches: [ "*" ]
    tags-ignore: [ "**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Sync definition artifacts
      run: npm run definitions:sync

    - name: Run linter
      run: npm run lint

    - name: Compile TypeScript
      run: npm run compile

    - name: Setup virtual display
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Run full test suite
      run: xvfb-run -a npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Sync definition artifacts
      run: npm run definitions:sync

    - name: Install vsce (VS Code Extension Manager)
      run: npm install -g @vscode/vsce

    - name: Compile extension
      run: npm run vscode:prepublish

    - name: Get build SHA
      id: version
      run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Package extension
      run: vsce package

    - name: Get package filename
      id: package
      run: |
        PACKAGE_FILE=$(ls *.vsix | head -1)
        echo "filename=$PACKAGE_FILE" >> $GITHUB_OUTPUT

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: vscode-extension-${{ steps.version.outputs.sha_short }}
        path: ${{ steps.package.outputs.filename }}
        retention-days: 30
