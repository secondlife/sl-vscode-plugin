---
name: pre-commit

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1
